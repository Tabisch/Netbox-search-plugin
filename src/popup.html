<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search NetBox</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 320px; padding: 12px; }
    form { display: flex; gap: 6px; }
    .footer { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .footer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <form id="form">
    <input id="query" type="search" placeholder="Search NetBox…" autofocus>
    <button type="submit">Go</button>
  </form>
  <div class="footer">
    <span id="instance"></span>
    <a href="#" id="options">Options</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
