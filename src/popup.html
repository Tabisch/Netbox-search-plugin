<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Search NetBox</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 380px; padding: 12px; }
    .row { display: flex; gap: 6px; }
    .row + .row { margin-top: 8px; }
    select {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    #results { list-style: none; margin: 8px -12px 0; padding: 0; max-height: 360px; overflow-y: auto; }
    #results:empty { display: none; }
    #results a { display: block; padding: 6px 12px; color: inherit; text-decoration: none; }
    #results a:hover, #results a.active { background: var(--hover); }
    .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type { margin-left: 6px; font-size: 11px; font-weight: normal; color: var(--accent); }
    .detail { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #message { margin-top: 8px; font-size: 12px; color: var(--muted); }
    #message:empty { display: none; }
    #message.error { color: var(--error); }
    .footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .footer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <form id="form">
    <div class="row">
      <input id="query" type="search" placeholder="Search NetBox…" autofocus autocomplete="off"
             role="combobox" aria-controls="results" aria-expanded="false">
      <button type="submit">Go</button>
    </div>
    <div class="row">
      <select id="instance" aria-label="Instance"></select>
      <select id="type" aria-label="Object type"></select>
    </div>
  </form>
  <ul id="results" role="listbox" aria-label="Matches"></ul>
  <div id="message" role="status"></div>
  <div class="footer">
    <span id="hint"></span>
    <a href="#" id="options">Options</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
